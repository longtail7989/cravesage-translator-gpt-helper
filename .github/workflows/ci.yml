name: Helper CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  helper:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated offline synthetic tests
        run: node scripts/test.mjs
      - name: Build standalone helper from nine pinned archives
        run: node scripts/build-helper.mjs --out dist --offline
      - name: Generate external release checksum
        shell: pwsh
        run: |
          $zip = Get-Item dist/cravesage-translator-gpt-helper-*-windows-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $zip.DirectoryName 'SHA256SUMS.txt'), "$hash  $($zip.Name)`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-helper-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
